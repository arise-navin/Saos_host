services:
  - type: web
    name: saos-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm ci --include=dev --prefix fluent-workspace
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: saos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SAOS_DATA_DIR
        value: /var/data
      - key: TURSO_DATABASE_URL
        value: libsql://saos-navin-patel.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SAOS_MULTI_USER
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://saos-host.vercel.app
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_MODEL
        value: gpt-oss:120b
      - key: OLLAMA_API_KEY
        sync: false
